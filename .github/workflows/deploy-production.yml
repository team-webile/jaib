name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".scripts/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch: {}

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect changed folders
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before || 'HEAD~1' }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            scripts:
              - '.scripts/**'

      - name: Summary
        run: |
          echo "backend  changed: ${{ steps.changes.outputs.backend }}"
          echo "frontend changed: ${{ steps.changes.outputs.frontend }}"
          echo "scripts  changed: ${{ steps.changes.outputs.scripts }}"

      - name: Deploy backend
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.JAIB_BACKEND_HOST }}
          username: ${{ secrets.JAIB_BACKEND_USER }}
          port: ${{ secrets.JAIB_BACKEND_PORT }}
          key: ${{ secrets.JAIB_BACKEND_KEY }}
          script: |
            cd /var/www/api.jaib.co/.scripts
            chmod +x deploy-backend.sh lib.sh
            bash deploy-backend.sh

      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.JAIB_FRONTEND_HOST }}
          username: ${{ secrets.JAIB_FRONTEND_USER }}
          port: ${{ secrets.JAIB_FRONTEND_PORT }}
          key: ${{ secrets.JAIB_FRONTEND_KEY }}
          script: |
            cd /var/www/jaib.co/.scripts
            chmod +x deploy-frontend.sh
            bash deploy-frontend.sh
